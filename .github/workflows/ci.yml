name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:65432/ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      RATE_LIMIT_HASH_SECRET: ci-rate-limit-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run migration:validate
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Whitespace validation
        run: git diff --check
